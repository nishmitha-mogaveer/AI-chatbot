<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPlacer - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>💼 JobPlacer</h1>
        <p class="subtitle">Your AI-powered placement assistant</p>

        <h2 id="form-title">Sign in </h2>
        <p id="form-subtitle">Access your JobPlacer account</p>

        

        
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >


        <button id="auth-btn" class="auth-btn">
            Sign In
        </button>
        <div class="divider">
            <span>OR</span>
        </div>
        <button id="google-btn" class="google-btn">
            🔵 Continue with Google
        </button>

        <p id="message"></p>

        <p class="switch-text">
            <span id="switch-text">Don't have an account?</span>
            <button id="switch-btn">Create Account</button>
        </p>

    </div>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
